# disable_unnecessary_services.yml - Disable services not needed on servers
# REF: https://oneuptime.com/blog/post/2026-02-21-how-to-use-ansible-to-disable-unnecessary-services/view
---

- name: Set var for unneccessary systemd units to disable
  ansible.builtin.set_fact:
    units_to_disable:
      - fwupd-refresh.service
      - fwupd-refresh.timer
      - fwupd.service
      - ModemManager.service

- name: Stop and disable unnecessary systemd units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ units_to_disable }}"
  failed_when: false
